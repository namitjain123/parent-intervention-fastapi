name: Deploy FastAPI Backend to Azure

# Only run when the backend (or this workflow) changes - frontend-only
# commits shouldn't redeploy and restart the API.
on:
  push:
    branches:
      - updating_episode_and_website_ui
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

# Run deploys one at a time. Overlapping runs let an older commit overwrite
# a newer one (8a1f03e started first but finished after d9db77c).
#
# Queue rather than cancel: cancelling a run mid-deploy doesn't stop the
# package Azure is already processing, so the next run hits a busy App
# Service and fails with 409 Conflict (3b5cb16 cancelled -> b431253 409).
# GitHub still drops any *pending* run that a newer push supersedes, so the
# newest commit is always the one that lands.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync database schema
        # Adds any columns present in app/models.py but missing from the live
        # database - additive only, never drops or alters existing columns.
        # Runs BEFORE deploy so new columns exist before the new code (which
        # may query them) goes live, closing the gap that has broken
        # production every time a model gained a field without this step.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENANT_ID: unused-for-schema-sync
          CLIENT_ID: unused-for-schema-sync
        run: python sync_schema.py --apply

      - name: Zip backend
        run: zip -r ../backend.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: parent-intervention
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip